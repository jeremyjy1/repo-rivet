[api]
api_key = "replace-with-your-api-key"
base_url = "https://api.openai.com/v1"
model = "replace-with-model-name"
context_window_tokens = 128000
# provider_default, enabled, or disabled.
thinking_mode = "provider_default"
# Optional for compatible reasoning models: low, high, or max.
# reasoning_effort = "low"
# Optional optimization; unavailable or unknown encodings fall back to conservative estimation.
# tokenizer_encoding = "o200k_base"
timeout_seconds = 60
max_retries = 3

[token]
# Cost ceiling for one active cache epoch. The safe model budget still takes precedence.
active_prompt_limit = 65536
reserved_output_tokens = 4096
reserved_tool_result_tokens = 2048
safety_margin_ratio = 0.15
soft_limit_ratio = 0.70
hard_limit_ratio = 0.85
default_correction_factor = 1.25
calibration_window = 20
max_context_overflow_retries = 2

[reasoning]
enabled = true
# off, summary, or trace; structured summaries never expose raw chain-of-thought.
display = "summary"
max_summary_chars = 1000
recent_event_limit = 8
require_for_mutating_tools = true
require_for_commands = true
max_reflection_only_turns = 2

[approval]
# allow-all, llm-auto, safe-auto, always-ask, or read-only
mode = "safe-auto"
non_interactive = "deny"
approval_timeout_seconds = 120
remember_session_approvals = true
remember_session_denials = true

[approval.llm]
enabled = true
# model = "approval-model"
# A local gate sends higher-risk allow recommendations to human approval.
max_auto_approve_risk = "medium"
timeout_seconds = 10

[approval.safety]
deny_outside_workspace_write = true
deny_privilege_escalation = true
deny_secret_access = true
deny_device_access = true

[approval.toolchains]
# Additional executable directories trusted for deterministic build/check/test templates.
trusted_directories = []
