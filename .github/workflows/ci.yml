name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      REPORIVET_LIVE_API_KEY: ${{ secrets.REPORIVET_LIVE_API_KEY }}
      REPORIVET_LIVE_BASE_URL: ${{ vars.REPORIVET_LIVE_BASE_URL }}
      REPORIVET_LIVE_MODEL: ${{ vars.REPORIVET_LIVE_MODEL }}
      REPORIVET_LIVE_CONTEXT_WINDOW: ${{ vars.REPORIVET_LIVE_CONTEXT_WINDOW }}
      REPORIVET_LIVE_REASONING_EFFORTS: ${{ vars.REPORIVET_LIVE_REASONING_EFFORTS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Test real model integration
        if: env.REPORIVET_LIVE_API_KEY != '' && env.REPORIVET_LIVE_MODEL != ''
        env:
          REPORIVET_RUN_LIVE_API: "1"
        run: uv run pytest -m live_api --run-live-api
