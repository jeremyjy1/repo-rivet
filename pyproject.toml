[project]
name = "repo-rivet"
version = "0.1.0"
description = "A local-first coding agent that reads files, edits code, runs commands, and verifies its changes."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "openai",
    "pydantic>=2",
    "pyyaml>=6.0.2",
    "rich",
    "tiktoken>=0.14.0",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn>=0.35",
]

[project.scripts]
reporivet = "repo_rivet.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.18",
    "pytest",
    "ruff",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "live_api: calls a configured real OpenAI-compatible API and may incur charges",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
show_error_codes = true
